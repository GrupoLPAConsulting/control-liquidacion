  #gate::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.18)}
  .gatecard{position:relative;background:#fff;border-radius:14px;padding:30px 34px;width:360px;
            box-shadow:0 10px 34px rgba(15,30,60,.22);text-align:center}
  .gatecard img.gl{width:212px;height:auto;margin:0 auto 22px;display:block}
  .gatecard h2{font-size:17px;font-weight:600;margin-bottom:3px}
  .gatecard .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px}
  .gatecard input{width:100%;padding:11px 13px;font-size:14px;border:1px solid #C9D2DD;border-radius:7px;
                  background:#FCFDFE;font-family:var(--sans)}
  .gatecard input:focus{outline:2px solid var(--navy);outline-offset:0;border-color:var(--navy)}
  .gatecard button{width:100%;margin-top:12px;padding:12px;font-size:14px;font-weight:600;color:#fff;
                   background:var(--navy);border:none;border-radius:7px;cursor:pointer;font-family:var(--sans)}
  .gatecard button:hover{background:var(--navy-soft)}
  .gatecard button:disabled{opacity:.6;cursor:default}
  .gatecard .err{color:var(--bad-tx);font-size:12.5px;margin-top:11px;min-height:17px}
  .gatecard .foot{font-size:11px;color:var(--ink-faint);margin-top:18px;line-height:1.55}
</style>

const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrir(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64u8(D.salt), iterations:D.it, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u8(D.iv)}, key, b64u8(D.ct));
  return new TextDecoder().decode(plano);
}

const inp = document.getElementById('p');
const btn = document.getElementById('b');
const err = document.getElementById('e');

async function intentar(){
  if(!inp.value) return;
  btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
  try{
    const html = await abrir(inp.value);
    document.open(); document.write(html); document.close();
  }catch(ex){
    btn.disabled = false; btn.textContent = 'Ingresar';
    err.textContent = 'Contraseña incorrecta.';
    inp.value = ''; inp.focus();
  }
}
btn.onclick = intentar;
inp.onkeydown = e => { if(e.key === 'Enter') intentar(); };
window.addEventListener('load', ()=>{
  if(!crypto || !crypto.subtle){
    err.textContent = 'Este navegador no permite descifrar la página. Abrila desde la dirección web (https).';
    btn.disabled = true;
  } else inp.focus();
});
</script>
